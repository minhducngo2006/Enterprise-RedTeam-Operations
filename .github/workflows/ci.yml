name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -B -m unittest discover -s tests -v
      - name: Run offline synthetic smoke checks
        run: |
          set -euo pipefail
          python -B tools/ad_audit.py uac 512 --json | python -c 'import json,sys; assert json.load(sys.stdin)["uac_integer"] == 512'
          python -B tools/evidence_report.py --file examples/synthetic-evidence.json --format json | cmp - tests/fixtures/synthetic-report.json
          python -B tools/evidence_report.py --file examples/synthetic-evidence.json --format markdown | cmp - tests/fixtures/synthetic-report.md
